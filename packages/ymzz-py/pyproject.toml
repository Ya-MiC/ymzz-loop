[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ymzz"
version = "0.21.1"
description = "稟冊本機 SDK：電話稱呼與封存檔名檢查。不連外。"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "晏銘湛箴" }]

[tool.setuptools.packages.find]
where = ["src"]
