[package]
name = "ymzz-vibe"
version = "0.21.0"
edition = "2021"
license = "MIT"
publish = false
description = "ymzz-loop v0.21 local-first core (Rust). Node v0.20 automation stays beside it."

[[bin]]
name = "ymzz-vibe"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
