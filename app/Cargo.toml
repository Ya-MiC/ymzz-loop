[package]
name = "ymzz-vibe"
version = "0.21.0"
edition = "2021"
license = "MIT"
publish = false
description = "ymzz-loop v0.21 local-first core (Rust). Node v0.20 automation stays beside it."

[[bin]]
name = "ymzz-vibe"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "=2.4.1"
rustls = { version = "=0.23.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "=1.11.0"
webpki-roots = "=0.26.8"
zeroize = "=1.8.1"
time = "=0.3.36"
indexmap = "=2.2.6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[dev-dependencies]
rcgen = "=0.13.1"
