name: ymzz-loop · daily-review
# 每小時醒來一次，閘門 <10 秒；只有「本地時間 ≥ 提醒時間 且 今天還沒跑過」才繼續。
# Wakes hourly; a <10s gate continues only when local time ≥ REMIND_TIME and today hasn't run yet.
# 時區/時間 time zone & time: repo Settings → Variables → YMZZ_TZ (e.g. Asia/Seoul), YMZZ_REMIND_TIME (e.g. 07:00)
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: daily-review
env:
  YMZZ_TZ: ${{ vars.YMZZ_TZ }}
  YMZZ_REMIND_TIME: ${{ vars.YMZZ_REMIND_TIME }}
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASS: ${{ secrets.SMTP_PASS }}
  MAIL_TO: ${{ secrets.MAIL_TO }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 1 }
      - name: ⓪ 閘門 gate (no npm install)
        id: gate
        run: node scripts/gate.mjs
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: package.json }
      - if: steps.gate.outputs.go == 'true'
        run: npm install --no-audit --no-fund
      - name: ① 建今日空白頁 create today's page
        if: steps.gate.outputs.go == 'true'
        run: npm run create-today
      - name: ② 寄提醒信 email reminder
        if: steps.gate.outputs.go == 'true'
        run: npm run send-reminder
      - name: ③ 同步昨日到 sinks / sync yesterday
        if: steps.gate.outputs.go == 'true'
        run: npm run sync-yesterday
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_BITABLE_TABLE_ID: ${{ secrets.FEISHU_BITABLE_TABLE_ID }}
          FEISHU_HOLDINGS_TABLE_ID: ${{ secrets.FEISHU_HOLDINGS_TABLE_ID }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
          FEISHU_WRITE_DOC: ${{ vars.FEISHU_WRITE_DOC }}
          FEISHU_BASE_URL: ${{ vars.FEISHU_BASE_URL }}
          FEISHU_DATE_FIELD: ${{ vars.FEISHU_DATE_FIELD }}
      - name: ④ commit snapshot + dedupe mark
        if: steps.gate.outputs.go == 'true'
        id: commit
        run: |
          node scripts/gate.mjs --mark > /dev/null
          git config user.name "ymzz-bot"; git config user.email "ymzz-bot@users.noreply.github.com"
          git add notion .ymzz
          if ! git diff --cached --quiet; then git commit -m "sync: ${{ steps.gate.outputs.today }}" && git push; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: ⑤ Notion 同步紀錄 sync log
        if: steps.gate.outputs.go == 'true'
        run: npm run write-log
        env:
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.commit.outputs.sha }}
      - name: keepalive (GitHub 60-day inactivity guard)
        if: always() && steps.gate.outputs.go == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/daily-review.yml/enable || true
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( (now-last)/86400 )) -ge 45 ]; then
            git config user.name "ymzz-bot"; git config user.email "ymzz-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive" && git push || true
          fi
      - name: chapter complete (600 days) — pause schedule for summary
        if: always() && steps.gate.outputs.expired == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          echo "ymzz-loop chapter complete (day ${{ steps.gate.outputs.day }}/${{ steps.gate.outputs.max_days }}, started ${{ steps.gate.outputs.started }}). Daily loop paused for 600-day summary."
          echo "Schedule will be disabled. Fork a newer release when you want to continue."
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/daily-review.yml/disable || true
          mkdir -p .ymzz
          echo "${{ steps.gate.outputs.today }}" > .ymzz/expired
          git config user.name "ymzz-bot"; git config user.email "ymzz-bot@users.noreply.github.com"
          git add .ymzz/expired
          git diff --cached --quiet || git commit -m "chapter: paused after ${{ steps.gate.outputs.max_days }} days for summary" && git push || true
      - name: email on chapter complete
        if: always() && steps.gate.outputs.expired == 'true'
        run: |
          npm install --no-audit --no-fund nodemailer >/dev/null 2>&1
          node -e "require('nodemailer').createTransport({host:process.env.SMTP_HOST||'smtp.gmail.com',port:+(process.env.SMTP_PORT||465),secure:true,auth:{user:process.env.SMTP_USER,pass:process.env.SMTP_PASS}}).sendMail({from:process.env.SMTP_USER,to:process.env.MAIL_TO,subject:'ymzz-loop · 600-day chapter complete',text:'Your ymzz-loop chapter has reached ${{ steps.gate.outputs.max_days }} days (started ${{ steps.gate.outputs.started }}). The daily loop is paused so you can close the chapter with a 600-day summary. Your Notion, Sheets and Markdown history stay yours. Deploy a newer release to start the next 600-day chapter.\n\n${{ github.server_url }}/${{ github.repository }}'}).catch(e=>{console.error(e); process.exit(0)})"
      - name: email on failure
        if: failure()
        run: npm install --no-audit --no-fund nodemailer >/dev/null 2>&1; node -e "require('nodemailer').createTransport({host:process.env.SMTP_HOST||'smtp.gmail.com',port:+(process.env.SMTP_PORT||465),secure:true,auth:{user:process.env.SMTP_USER,pass:process.env.SMTP_PASS}}).sendMail({from:process.env.SMTP_USER,to:process.env.MAIL_TO,subject:'⚠️ 每日復盤失敗 Daily review failed',text:'${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'})"
