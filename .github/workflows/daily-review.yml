name: daily-review
on:
  schedule:
    - cron: "0 22 * * *"   # 每天 07:00 首爾時間 (UTC+9) = 22:00 UTC 前一天
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: daily-review
env:
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASS: ${{ secrets.SMTP_PASS }}
  MAIL_TO: ${{ secrets.MAIL_TO }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: ① 建今日空白頁 create today's page
        run: npm run create-today
      - name: ② 寄提醒信 email reminder
        run: npm run send-reminder
      - name: ③ 同步昨日到 Sheet + md / sync yesterday
        run: npm run sync-yesterday
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
      - name: ④ commit snapshot
        id: commit
        run: |
          git config user.name "Tully"; git config user.email "tully@yamic.de5.net"
          git add notion
          if ! git diff --cached --quiet; then git commit -m "sync: $(TZ=Asia/Seoul date +%m%d_%H%M)_seoul" && git push; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: ⑤ Notion 同步紀錄 sync log
        run: npm run write-log
        env:
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.commit.outputs.sha }}
      - name: keepalive (GitHub 60-day inactivity guard)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/daily-review.yml/enable || true
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( (now-last)/86400 )) -ge 45 ]; then
            git config user.name "Tully"; git config user.email "tully@yamic.de5.net"
            git commit --allow-empty -m "keepalive $(TZ=Asia/Seoul date +%m%d_%H%M)_seoul" && git push || true
          fi
      - name: email on failure
        if: failure()
        run: node -e "require('nodemailer').createTransport({host:process.env.SMTP_HOST||'smtp.gmail.com',port:+(process.env.SMTP_PORT||465),secure:true,auth:{user:process.env.SMTP_USER,pass:process.env.SMTP_PASS}}).sendMail({from:process.env.SMTP_USER,to:process.env.MAIL_TO,subject:'⚠️ 每日復盤失敗 Daily review failed',text:'${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'})"
