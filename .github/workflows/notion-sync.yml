name: notion-sync
on:
  schedule:
    - cron: "0 0 * * *"   # 每天 09:00 首爾 Seoul (UTC+9)
  workflow_dispatch:
permissions:
  contents: write
concurrency: notion-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
      - name: commit
        run: |
          git config user.name "Tully"; git config user.email "tully@yamic.de5.net"
          git add notion
          git diff --cached --name-status > /tmp/changes.txt
          if [ -s /tmp/changes.txt ]; then git commit -m "sync: notion $(TZ=Asia/Seoul date +%F_%H%M) KST" && git push; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        id: commit
      - name: notion log
        run: node scripts/log.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.commit.outputs.sha }}
