name: daily-review
on:
  schedule:
    - cron: "0 12 * * *"   # 每天 21:00 首爾 Seoul (UTC+9)：建今日頁 + 寄提醒 + 同步
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: daily-review
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: today's blank review page
        run: npm run daily
      - name: email reminder
        run: npm run remind
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: sync to md + sheet
        run: npm run sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
      - name: commit
        id: commit
        run: |
          git config user.name "Tully"; git config user.email "tully@yamic.de5.net"
          git add notion
          git diff --cached --name-status > /tmp/changes.txt
          if [ -s /tmp/changes.txt ]; then git commit -m "sync: $(TZ=Asia/Seoul date +%F_%H%M) KST" && git push; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: notion sync log
        run: npm run log
        env:
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.commit.outputs.sha }}
      - name: keepalive (GitHub 60-day inactivity guard)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/notion-sync.yml/enable || true
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( (now-last)/86400 )) -ge 45 ]; then
            git config user.name "Tully"; git config user.email "tully@yamic.de5.net"
            git commit --allow-empty -m "keepalive $(TZ=Asia/Seoul date +%F) KST" && git push || true
          fi
      - name: email on failure
        if: failure()
        run: node -e "require('nodemailer').createTransport({host:process.env.SMTP_HOST||'smtp.gmail.com',port:+(process.env.SMTP_PORT||465),secure:true,auth:{user:process.env.SMTP_USER,pass:process.env.SMTP_PASS}}).sendMail({from:process.env.SMTP_USER,to:process.env.MAIL_TO,subject:'⚠️ 每日復盤同步失敗 Daily review sync failed',text:'${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'})"
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
