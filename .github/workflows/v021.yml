name: v021
on: [push, pull_request]
permissions: { contents: read }
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: GTK libraries for the Linux fallback window
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm install --prefix third_party/t3code --omit=dev
      - run: cargo test --manifest-path app/Cargo.toml
      - run: cargo build --manifest-path app/Cargo.toml
      - run: npm install --no-save --no-audit --no-fund playwright
      - run: npx playwright install --with-deps chromium
      - run: node test/clickthrough.mjs
      - run: node --test test/v021-tokens.test.mjs test/v021-t3-reuse.test.mjs packages/ymzz/test.test.mjs
  core-other-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows time zone data
        if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - run: npm install --prefix third_party/t3code --omit=dev
      - run: cargo test --manifest-path app/Cargo.toml
