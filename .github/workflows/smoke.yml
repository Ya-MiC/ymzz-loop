name: smoke
on:
  push:
    branches: [cursor/v0211-mobile-core-e023]
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  windows-webdriver:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile the core and a debug window
        shell: bash
        run: |
          cargo build --manifest-path app/Cargo.toml
          cargo install tauri-cli --version 2.12.4 --locked
          cargo install tauri-driver --version 2.1.0 --locked
          mkdir -p src-tauri/binaries/core
          cp app/target/debug/ymzz-vibe.exe src-tauri/binaries/core/ymzz-vibe.exe
          (cd src-tauri && cargo tauri build --debug --no-bundle)
      - name: Edge driver
        shell: pwsh
        run: |
          $version = (Get-Item "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
          Invoke-WebRequest "https://msedgedriver.azureedge.net/$version/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath edgedriver
      - name: WebDriver reads the nickname screen
        shell: pwsh
        run: |
          $driver = Join-Path (Get-Location) "edgedriver\msedgedriver.exe"
          $tauri = Start-Process tauri-driver -ArgumentList "--native-driver",$driver -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $exe = Join-Path (Get-Location) "src-tauri\target\debug\ymzz-bingce.exe"
          node scripts/windows-webdriver.mjs $exe
          if ($tauri -and -not $tauri.HasExited) { Stop-Process -Id $tauri.Id -Force }
