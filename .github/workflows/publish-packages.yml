name: publish-packages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 真正發佈。預設否。npm 需要 NPM_TOKEN；PyPI 需要受信任發佈已對準 ymzz。
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm test
        working-directory: packages/ymzz
      - run: npm pack --dry-run
        working-directory: packages/ymzz
      - run: |
          python -m pip install --upgrade build twine
          PYTHONPATH=src python -m unittest discover -s tests
          python -m build
          twine check dist/*
        working-directory: packages/ymzz-py
      - name: Publish npm only when asked and a token exists
        if: ${{ inputs.publish }}
        working-directory: packages/ymzz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set. Nothing was published."
            exit 1
          fi
          npm publish --access public
      - name: Publish PyPI only when asked
        if: ${{ inputs.publish }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/ymzz-py/dist/
