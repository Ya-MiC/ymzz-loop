name: installers
on:
  push:
    branches: [cursor/v0211-mobile-core-e023]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles deb,appimage
          - os: windows-latest
            args: --bundles nsis,msi
          - os: macos-latest
            args: --bundles dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 file squashfs-tools
      - name: Compile the local core
        run: cargo build --release --manifest-path app/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - name: Stage the core next to the window
        shell: bash
        run: |
          mkdir -p src-tauri/binaries/core
          if [ -f app/target/release/ymzz-vibe.exe ]; then
            cp app/target/release/ymzz-vibe.exe src-tauri/binaries/core/ymzz-vibe.exe
          else
            cp app/target/release/ymzz-vibe src-tauri/binaries/core/ymzz-vibe
            chmod 755 src-tauri/binaries/core/ymzz-vibe
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: v0.21.1-preview
          releaseName: 稟冊 0.21.1 預覽
          releaseDraft: true
          prerelease: true
          releaseBody: |
            稟冊 0.21.1 預覽。這是草稿，尚未正式發布。沙箱收款不會扣款。
            桌面安裝檔的核心在視窗旁邊。手機版把同一個核心編進程式裡。
            沒有上架 Google Play、App Store 或 TestFlight。0.21.0 的草稿沒有被這份取代。
            macOS 若被 Gatekeeper 擋住：系統設定 → 隱私權與安全性 → 仍要打開。
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ymzz-bingce-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: warn
      - name: Launch the packaged macOS app
        if: matrix.os == 'macos-latest'
        run: sh scripts/macos-launch-smoke.sh
      - name: Install the MSI and read the page
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/windows-install-smoke.ps1
      - name: Install the deb and read the page
        if: matrix.os == 'ubuntu-22.04'
        run: sh scripts/linux-launch-smoke.sh
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Android SDK pieces
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.12433566" "emulator" "platform-tools"
      - name: Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Init and build a sideload APK
        working-directory: src-tauri
        run: |
          mkdir -p binaries/core
          cargo tauri android init --ci
          cargo tauri android build --apk --target aarch64
          cargo tauri android build --debug --apk --target x86_64
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Emulator opens onboarding and the briefing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 600
          script: node ${{ github.workspace }}/scripts/android-smoke.mjs ${{ github.workspace }}/src-tauri/gen/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ymzz-bingce-android-apk
          path: |
            src-tauri/gen/android/**/*.apk
            docs/mobile/*.png
            android-logcat.txt
          if-no-files-found: error
  ios:
    continue-on-error: true
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Simulator build
        working-directory: src-tauri
        run: |
          mkdir -p binaries/core
          cargo tauri ios init --ci
          cargo tauri ios build --target aarch64-sim
      - name: Boot the simulator when the app exists
        run: |
          APP=$(find src-tauri/gen/apple -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "no simulator app"
            exit 1
          fi
          DEVICE=$(xcrun simctl list devices available | sed -n 's/.*iPhone[^(]*(\([A-Fa-f0-9-]\{36\}\)).*/\1/p' | head -1)
          if [ -z "$DEVICE" ]; then
            echo "no iPhone simulator"
            xcrun simctl list devices available
            exit 1
          fi
          echo "boot $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" dev.ymzz.bingce
          sleep 8
          mkdir -p docs/mobile
          xcrun simctl io booted screenshot docs/mobile/ios-simulator.png
          echo "YMZZ_SMOKE ios simulator launched"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ymzz-bingce-ios-simulator
          path: |
            src-tauri/gen/apple/**/*.app
            docs/mobile/ios-simulator.png
          if-no-files-found: warn
